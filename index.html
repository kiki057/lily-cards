<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#162750">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Lily Cards">
<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<title>Lily Card Voyage</title>
<style>:root{
  --ink:#1b2340; --paper:#fff8e8; --gold:#ffc83d; --red:#e85a4f; --blue:#3d8bfd; --green:#2fb36d; --thai:#e0a526;
  --cw: min(26.5vw, 16.5vh, 158px); --ch: calc(var(--cw) * 1.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1730;font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,"Noto Sans Thai","Leelawadee UI",sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer;border:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:var(--sat,0) var(--sar,0) var(--sab,0) var(--sal,0);overflow:hidden;background:#0d1730}
#saprobe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.screen{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#1f3566,#162750);color:#fff;font-weight:800;font-size:15px;min-height:44px;flex-wrap:nowrap;box-shadow:0 2px 6px #0006;z-index:5}
#top .pill{display:flex;align-items:center;gap:4px;background:#0006;border-radius:20px;padding:3px 10px;white-space:nowrap}
#top .relics{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none;min-width:0}
#top .relics::-webkit-scrollbar{display:none}
#top .relic{font-size:20px;background:#ffffff1c;border-radius:8px;padding:1px 4px;line-height:1.3}
#top .ib{background:#ffffff22;color:#fff;border-radius:10px;padding:4px 9px;font-size:17px;font-weight:800}
#top .ib small{font-size:12px;margin-left:2px}

/* ---------- generic ---------- */
.btn{background:linear-gradient(#ffd75e,#f2a516);color:#4a2a00;font-weight:900;font-size:19px;padding:12px 26px;border-radius:16px;box-shadow:0 4px 0 #b06d00,0 6px 12px #0005;letter-spacing:.5px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b06d00}
.btn.blue{background:linear-gradient(#7cc0ff,#3d8bfd);color:#fff;box-shadow:0 4px 0 #1f5bb5,0 6px 12px #0005}
.btn.green{background:linear-gradient(#6fe0a0,#2fb36d);color:#fff;box-shadow:0 4px 0 #1b7a47,0 6px 12px #0005}
.btn.red{background:linear-gradient(#ff8b80,#e85a4f);color:#fff;box-shadow:0 4px 0 #a8342b,0 6px 12px #0005}
.btn.ghost{background:#ffffff26;color:#fff;box-shadow:none;border:2px solid #fff6}
.btn[disabled]{filter:grayscale(1);opacity:.55}
.panel{background:var(--paper);border-radius:20px;padding:18px;box-shadow:0 10px 30px #0008;border:4px solid #e9cf95;max-width:640px;width:calc(100% - 24px);max-height:calc(100% - 24px);overflow:auto}
.panel h2{margin:0 0 8px;font-size:24px;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.muted{opacity:.7}
#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:#000c;color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;font-size:18px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:60;text-align:center;max-width:90vw}
#toast.on{opacity:1}
#overlay{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#08102acc;padding:12px}
#overlay.on{display:flex}

/* ---------- sea background ---------- */
.seabg{position:absolute;inset:0;overflow:hidden;z-index:0}
.seabg .sky{position:absolute;left:0;right:0;top:0;height:52%}
.seabg .water{position:absolute;left:0;right:0;bottom:0;height:52%}
.seabg .wave{position:absolute;left:-10%;width:120%;height:22px;background:radial-gradient(circle at 20px -6px,transparent 16px,#ffffff30 17px,transparent 19px) repeat-x;background-size:40px 22px;animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(40px)}}
.seabg .sun{position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff7c2,#ffd75e 60%,#ffd75e00 72%);right:12%;top:8%}
.seabg .cloud{position:absolute;background:#ffffffd0;border-radius:40px;height:22px;animation:cloud 40s linear infinite}
.seabg .cloud::before{content:"";position:absolute;width:45%;height:180%;left:20%;bottom:30%;background:inherit;border-radius:50%}
@keyframes cloud{from{transform:translateX(-30vw)}to{transform:translateX(110vw)}}

/* ---------- title ---------- */
.title-wrap{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:12px;padding:16px;text-align:center}
body.land.short .title-wrap{flex-direction:row;flex-wrap:wrap;align-content:center;column-gap:24px;row-gap:8px}
body.land.short .title-wrap .logo{flex-basis:100%;font-size:clamp(28px,7vh,48px)}
body.land.short .lilybox{height:min(46vh,220px)}
body.land.short .panel .lilybox{display:none}
.logo{font-weight:900;color:#fff;line-height:.95;text-shadow:0 4px 0 #c2410c,0 6px 14px #0008;font-size:clamp(38px,11vw,72px);letter-spacing:1px}
.logo small{display:block;font-size:.42em;color:var(--gold);text-shadow:0 3px 0 #7c2d12;margin-top:6px;letter-spacing:3px}
.lilyimg{display:block;height:100%;width:auto;max-width:none;transform-origin:50% 100%;animation:breathe 2.8s ease-in-out infinite;filter:drop-shadow(0 5px 4px #0007);-webkit-user-drag:none}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-2%) scale(1.01,1.022)}}
.lilybox{height:min(30vh,250px);aspect-ratio:.63;display:flex;align-items:flex-end;justify-content:center;position:relative;max-width:100%}
.lilybox::after,.lilywrap::after{content:"";position:absolute;left:12%;right:12%;bottom:-3%;height:7%;border-radius:50%;background:radial-gradient(#0007,#0000 70%);z-index:-1}
.lilybox .lilyimg{animation:breathe 2.8s ease-in-out infinite,sway 5.6s ease-in-out infinite}
@keyframes sway{0%,100%{rotate:-1.2deg}50%{rotate:1.2deg}}
.menu{display:flex;flex-direction:column;gap:12px;width:min(320px,80vw)}
.small-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.small-links .btn{font-size:15px;padding:8px 14px}

/* ---------- map ---------- */
.mapscroll{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.maphead{position:sticky;top:0;z-index:3;text-align:center;color:#fff;font-weight:900;font-size:20px;padding:8px;text-shadow:0 2px 4px #000a;background:linear-gradient(#0008,#0000)}
.maphead small{display:block;font-size:13px;font-weight:700;opacity:.85}
.mapsvg{display:block;margin:0 auto}
.node{cursor:pointer}
.node circle.bg{fill:#fff8e8;stroke:#7a5a2a;stroke-width:3}
.node.done circle.bg{fill:#b9c3d6;stroke:#55617a}
.node.avail circle.bg{stroke:#ffc83d;stroke-width:5;animation:pulse 1.1s ease-in-out infinite}
.node.cur circle.bg{fill:#ffe9a8}
.node text{font-size:26px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.node.lock{opacity:.55}
@keyframes pulse{50%{stroke-width:9;stroke:#fff}}
.maplegend{position:relative;z-index:2;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;color:#fff;font-size:13px;font-weight:700;padding:6px;background:#0007}

/* ---------- combat ---------- */
.field{position:relative;flex:1;min-height:0;overflow:hidden}
.ents{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;padding:0 3% calc(12% + 26px)}
.ent{position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .18s}
.ent .sprite{position:relative;display:flex;align-items:flex-end;justify-content:center}
.ent img{display:block;filter:drop-shadow(0 6px 4px #0006);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ent.hit img,.ent.hit .lilyimg{animation:hitflash .35s}
.ent.swing .lilyimg{animation:swing .26s ease-out}
@keyframes swing{0%{transform:rotate(0)}45%{transform:rotate(9deg) scale(1.05)}100%{transform:rotate(0)}}
@keyframes hitflash{0%,100%{filter:none;transform:translateX(0)}20%{filter:brightness(3) saturate(0);transform:translateX(8px)}50%{transform:translateX(-6px)}}
.ent.lunge-l{transform:translateX(-40px)}
.ent.lunge-r{transform:translateX(40px)}
.ent.dead{animation:die .6s forwards}
@keyframes die{to{opacity:0;transform:translateY(30px) scale(.6) rotate(-10deg)}}
.enemies{display:flex;align-items:flex-end;gap:2%;justify-content:flex-end;flex:1}
.ent.targetable .sprite::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px dashed #ffc83d;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hpbar{width:110px;max-width:96%;height:14px;background:#0009;border-radius:8px;position:relative;margin-top:4px;border:2px solid #000a;overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff7a6e,#d33a2f);transition:width .3s}
.hpbar.pl i{background:linear-gradient(#7cf0a8,#24a35c)}
.hpbar b{position:absolute;inset:0;font-size:11px;color:#fff;display:flex;align-items:center;justify-content:center;text-shadow:0 1px 2px #000}
.blk{position:absolute;left:-14px;top:-6px;background:#5b8def;color:#fff;font-weight:900;font-size:12px;border-radius:50% 50% 45% 45%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:2}
.stats{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:130px}
.st{font-size:11px;font-weight:900;background:#000a;color:#fff;border-radius:8px;padding:1px 5px;white-space:nowrap}
.intent{display:flex;align-items:center;gap:3px;background:#fff8e8;border:3px solid #7a5a2a;border-radius:14px;padding:2px 8px;font-weight:900;font-size:15px;margin-bottom:4px;box-shadow:0 3px 6px #0005;white-space:nowrap}
.intent.atk{background:#ffe1dc;border-color:#c0392b;color:#8b1d12}
.intent.def{background:#dbe8ff;border-color:#2f62c8;color:#173b85}
.intent.buf{background:#efe2ff;border-color:#7b4bc4;color:#4a237f}
.ename{color:#fff;font-weight:900;font-size:12px;text-shadow:0 1px 3px #000;margin-top:2px;white-space:nowrap}
.player .lilywrap{position:relative;display:flex;justify-content:center;align-items:flex-end;z-index:0}
.dmgnum{position:absolute;z-index:30;font-weight:900;font-size:30px;color:#fff;text-shadow:0 3px 0 #b3261e,0 0 8px #000;pointer-events:none;animation:floatup .9s forwards}
.dmgnum.blkn{text-shadow:0 3px 0 #1f4fae,0 0 8px #000}
.dmgnum.heal{text-shadow:0 3px 0 #1b7a47,0 0 8px #000}
.dmgnum.txt{font-size:20px}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-14px) scale(1.15);opacity:1}100%{transform:translate(-50%,-60px) scale(1);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translate(6px,-3px)}50%{transform:translate(-5px,3px)}75%{transform:translate(3px,2px)}}
.slashfx{position:absolute;z-index:25;width:110px;height:110px;pointer-events:none;transform:translate(-50%,-50%);animation:slashfx .35s forwards}
.slashfx::before{content:"";position:absolute;left:5%;top:45%;width:90%;height:10px;background:linear-gradient(90deg,#fff0,#fff,#ffe58a,#fff0);border-radius:6px;transform:rotate(-35deg);box-shadow:0 0 12px #fff}
@keyframes slashfx{from{opacity:1;transform:translate(-50%,-50%) scale(.4)}to{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}

.dock{position:relative;z-index:3;display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"bl st br" "hd hd hd";align-items:center;column-gap:8px;background:linear-gradient(#24324f,#1a2440 50px,#111a33);color:#fff;flex:none}
.dock .bl,.dock .br{display:flex;align-items:center;gap:8px;padding:6px 10px}
.dock .bl{grid-area:bl}.dock .br{grid-area:br}.dock .stars{grid-area:st}.dock .hand{grid-area:hd}
body.land .dock{grid-template-columns:auto 1fr auto;grid-template-areas:"bl hd br";background:linear-gradient(#1a2440,#111a33)}
body.land .dock .bl,body.land .dock .br{flex-direction:column;justify-content:center;padding:6px 8px}
body.land .dock .stars{position:absolute;right:10px;top:-40px;background:#0009;border-radius:14px;padding:3px 8px;font-size:18px}
body.land .dock .stars span.lbl{font-size:9px}
body.land{--cw:min(14.5vw,26vh,150px)}
body.land .hand{height:calc(var(--ch) + 14px)}
body.land.short #top{min-height:36px;padding:3px 10px;font-size:13px}
body.land.short #top .ib{padding:2px 8px;font-size:15px}
body.land.short #top .relic{font-size:16px}
body.land.short .energy{width:44px;height:44px;font-size:19px}
body.land.short .endturn{font-size:13px;padding:7px 10px}
body.land.short .pile{font-size:11px;padding:2px 6px}body.land.short .pile b{font-size:14px}
body.short .ents{padding-bottom:calc(6% + 22px)}
.energy{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc83d 45%,#e08a00);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#5a3300;box-shadow:0 0 0 3px #fff8,0 0 14px #ffc83d;flex:none}
.energy.zero{filter:grayscale(1) brightness(.8);box-shadow:0 0 0 3px #fff4}
.pile{font-size:13px;font-weight:800;background:#ffffff1c;border-radius:10px;padding:4px 8px;text-align:center;line-height:1.1}
.pile b{display:block;font-size:17px}
.stars{flex:1;display:flex;align-items:center;justify-content:center;gap:2px;font-size:22px}
.stars .s{filter:grayscale(1) opacity(.35);transition:all .3s}
.stars .s.on{filter:none;transform:scale(1.15)}
.stars span.lbl{font-size:11px;font-weight:800;opacity:.75;margin-right:4px;text-align:right;line-height:1.05}
.endturn{font-size:16px;padding:10px 14px}

.hand{position:relative;z-index:4;height:calc(var(--ch) + 30px);background:linear-gradient(#1a2440,#111a33);flex:none}
.hint{position:absolute;left:0;right:0;top:10px;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 3px #000;pointer-events:none;z-index:6}

/* ---------- card ---------- */
.card{position:absolute;width:var(--cw);height:var(--ch);border-radius:calc(var(--cw)*.09);background:#fff8e8;border:3px solid #7a5a2a;box-shadow:0 4px 10px #0007;display:flex;flex-direction:column;align-items:stretch;overflow:hidden;transition:transform .2s,left .2s,top .2s,box-shadow .2s,filter .2s;font-size:calc(var(--cw) * .088);cursor:pointer;transform-origin:50% 100%}
.card.attack{background:linear-gradient(#fff3ec,#ffe0d5);border-color:#b3412f}
.card.skill{background:linear-gradient(#eef6ff,#d7e8ff);border-color:#2f62c8}
.card.power{background:linear-gradient(#f7efff,#e6d4ff);border-color:#7b4bc4}
.card.status{background:linear-gradient(#55595f,#2c2f35);border-color:#111;color:#fff}
.card.special{background:linear-gradient(#fff9d6,#ffe680);border-color:#d99a00}
.card .cost{position:absolute;left:3%;top:2%;width:26%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc83d 45%,#e08a00);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.55em;color:#5a3300;border:2px solid #fff;z-index:2}
.card .cost.cheap{background:radial-gradient(circle at 35% 30%,#d8ffe8,#4ee08a 50%,#1e9e55);color:#053a1b}
.card .nm{font-weight:900;text-align:center;padding:6% 4% 0 26%;line-height:1.05;font-size:1em;min-height:2.2em;display:flex;align-items:center;justify-content:center}
.card .art{font-size:3.1em;text-align:center;line-height:1.15;margin:2% 0 1%}
.card .tx{flex:1;font-size:.9em;text-align:center;padding:2% 5% 5%;line-height:1.18;font-weight:700;display:flex;flex-direction:column;justify-content:center;align-items:center}
.card .tx b{color:#b3261e}
.card.skill .tx b{color:#1d4fb8}
.card .tx .pw{display:block;margin-top:3px;padding:2px 3px;border-radius:6px;background:#fff6;border:1.5px dashed currentColor}
.card .subj{position:absolute;right:3%;top:3%;font-size:1.25em;width:24%;aspect-ratio:1;border-radius:30%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:2}
.card .ty{font-size:.62em;text-transform:uppercase;letter-spacing:1px;text-align:center;font-weight:900;opacity:.6}
.card.study{box-shadow:0 0 0 3px var(--sc),0 4px 10px #0007}
.card.cant{filter:grayscale(.7) brightness(.8)}
.card.sel{z-index:50 !important;box-shadow:0 0 0 4px #fff,0 0 24px #ffc83d,0 8px 20px #000a}
.card.static{position:relative}
.card.up .nm{color:#1b7a47}
.cardrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cardrow .card{position:relative}
.cardrow .card.pick:hover{transform:translateY(-6px)}
.price{text-align:center;font-weight:900;color:#7a4b00;margin-top:4px;font-size:16px}
.shopitem{display:flex;flex-direction:column;align-items:center}
.shopitem.sold{opacity:.35;pointer-events:none}

/* ---------- quiz ---------- */
.quiz{max-width:720px}
.quiz .qtag{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:15px;color:#fff;border-radius:12px;padding:5px 12px;margin:0 auto 10px;width:max-content;max-width:100%}
.quiz .qq{font-size:clamp(18px,min(5.4vw,4.6vh),30px);font-weight:900;text-align:center;line-height:1.25;margin:6px 0 14px}
.quiz .ans{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-aspect-ratio: 3/4){.quiz .ans{grid-template-columns:1fr 1fr}}
.quiz .ans button{background:#fff;border:3px solid #c9b07a;border-radius:14px;padding:10px;font-size:clamp(16px,min(4.6vw,4vh),24px);font-weight:800;color:var(--ink);box-shadow:0 3px 0 #c9b07a;min-height:56px}
.quiz .ans button.ok{background:#c9f7da;border-color:#2fb36d;box-shadow:0 3px 0 #2fb36d}
.quiz .ans button.no{background:#ffd6d1;border-color:#e85a4f;box-shadow:0 3px 0 #e85a4f}
.quiz .ans button.dim{opacity:.3;text-decoration:line-through}
.quiz .ex{margin-top:12px;font-size:18px;font-weight:700;text-align:center;line-height:1.3;padding:10px;border-radius:12px;background:#fff3c4}
.quiz .say{background:#ffffff;border:2px solid #c9b07a;border-radius:50%;width:40px;height:40px;font-size:20px;margin-left:6px;vertical-align:middle}
.quiz .pw{text-align:center;font-weight:800;font-size:15px;margin-bottom:6px;color:#7a4b00}
.bigok{font-size:44px;text-align:center;font-weight:900;color:#1b7a47}

/* ---------- misc screens ---------- */
.choice{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.choice .btn{text-align:left;font-size:17px;display:flex;gap:10px;align-items:center}
.choice .btn .em{font-size:28px}
.relicbig{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px;border:2px solid #e9cf95;text-align:left}
.relicbig .em{font-size:38px}
.relicbig b{display:block;font-size:17px}
.deckgrid{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.deckgrid .card{position:relative;--cw:min(28vw,128px)}
.stat-row{display:flex;justify-content:space-between;font-weight:800;padding:6px 4px;border-bottom:1px dashed #d9c08a}
.tog{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:800;font-size:17px;border-bottom:1px dashed #d9c08a}
.tog button{min-width:76px;padding:6px 10px;border-radius:10px;font-weight:900;background:#ddd}
.tog button.on{background:var(--green);color:#fff}
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:70;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.enemies.tight .intent{font-size:12px;padding:1px 5px;border-width:2px}
.enemies.tight .ename{font-size:10px}
.enemies.tight .st{font-size:9px;padding:1px 3px}
.enemies .ent{min-width:0}
.ename{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.card.study .nm{padding-right:25%}

body.short .quiz .ans button{min-height:44px}
body.short .quiz .qtag{margin-bottom:4px}
body.short .quiz .qq{margin:2px 0 8px}
body.short .panel{padding:12px}
body.short .bigok{font-size:30px}
body.short .quiz .ex{font-size:15px;margin-top:6px;padding:6px}

.card{color:var(--ink)}
.card.status{color:#fff}
#overlay.on ~ #toast{opacity:0 !important}
#toast{top:calc(var(--sat,0px) + 64px)}
.dock{grid-template-columns:auto minmax(0,1fr) auto}
.dock .stars{min-width:0;overflow:hidden}
@media (max-width:460px){.dock .bl,.dock .br{gap:6px;padding:6px 6px}.dock .stars span.lbl{display:none}.endturn{font-size:14px;padding:9px 10px}.energy{width:48px;height:48px;font-size:20px}.pile{padding:3px 6px}}

body.short .maplegend{font-size:11px;padding:3px;gap:6px}
body.short .maphead{font-size:16px;padding:4px}

/* iPad / iOS */
html,body{touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
.mapscroll,.title-wrap,.panel{overscroll-behavior:contain}
body.big{--cw:min(16vw,17vh,190px)}
body.big.land{--cw:min(12vw,21vh,180px)}
body.big .quiz{max-width:860px}
body.big .quiz .qq{font-size:clamp(26px,3.6vw,40px)}
body.big .quiz .ans button{font-size:clamp(22px,2.8vw,30px);min-height:72px}
body.big .panel{max-width:780px}
body.big #top{font-size:18px;min-height:52px}

body.land .hand{height:calc(var(--ch) + 30px)}

.offl{font-weight:800;font-size:14px;padding:5px 12px;border-radius:12px;color:#fff;background:#0007}
.offl.ok{background:#1b7a47cc}
.offl.wait{background:#a8342bcc}

.daily{display:flex;flex-direction:column;gap:2px;align-items:center;background:#0b1a3acc;color:#fff;border:2px solid #ffc83d88;border-radius:14px;padding:8px 14px;font-size:14px;max-width:min(92vw,460px);line-height:1.3}
.daily b{font-weight:900}
.daily .muted2{opacity:.75;font-size:12.5px}
body.land.short .daily{flex-basis:100%;max-width:560px}

/* ---------- FX ---------- */
.fxcv{position:absolute;left:0;top:0;z-index:12;pointer-events:none}
.fxflash{position:absolute;inset:0;z-index:13;pointer-events:none;animation:fxflash linear forwards}
@keyframes fxflash{from{opacity:1}to{opacity:0}}
.shake2{animation:shake2 .38s}
@keyframes shake2{15%{transform:translate(var(--shk),calc(var(--shk) * -.5))}35%{transform:translate(calc(var(--shk) * -.9),calc(var(--shk) * .6))}55%{transform:translate(calc(var(--shk) * .6),calc(var(--shk) * .3))}75%{transform:translate(calc(var(--shk) * -.3),calc(var(--shk) * -.3))}}
.player .lilywrap{transform-origin:50% 70%}
.act-dash .lilywrap{animation:actDash .36s ease-out}
@keyframes actDash{40%{transform:translateX(60px) skewX(-8deg)}100%{transform:none}}
.act-flip .lilywrap{animation:actFlip .52s ease-in-out}
@keyframes actFlip{50%{transform:translate(70px,-60px) rotate(180deg)}100%{transform:translate(0,0) rotate(360deg)}}
.act-flip2 .lilywrap{animation:actFlip2 .52s ease-in-out}
@keyframes actFlip2{50%{transform:translate(70px,-40px) rotate(-180deg)}100%{transform:translate(0,0) rotate(-360deg)}}
.act-leap .lilywrap{animation:actLeap .62s ease-in-out}
@keyframes actLeap{35%{transform:translate(40px,-90px) scale(1.05)}65%{transform:translate(90px,0) scale(1.05,.92)}100%{transform:none}}
.act-backflip .lilywrap{animation:actBack .62s ease-in-out}
@keyframes actBack{50%{transform:translate(-25px,-70px) rotate(-180deg)}100%{transform:rotate(-360deg)}}
.act-roll .lilywrap{animation:actRoll .56s ease-in-out}
@keyframes actRoll{50%{transform:translateX(-35px) rotate(-200deg) scale(.85)}100%{transform:rotate(-360deg)}}
.act-pose .lilywrap{animation:actPose .7s ease-in-out}
@keyframes actPose{25%{transform:translateY(-10px) rotate(-8deg)}60%{transform:translateY(-10px) rotate(8deg)}100%{transform:none}}
.act-cast .lilywrap{animation:actCast .4s ease-out}
@keyframes actCast{40%{transform:translateY(-8px) scale(1.04);filter:drop-shadow(0 0 14px #ffe680)}100%{transform:none;filter:none}}
.player.shielded .lilywrap::before{content:"";position:absolute;left:-14%;right:-14%;top:2%;bottom:-6%;border-radius:50%;border:2px solid rgba(170,215,255,.75);background:radial-gradient(ellipse at 50% 45%,rgba(140,200,255,0) 55%,rgba(140,200,255,.28));box-shadow:0 0 14px rgba(140,200,255,.45);animation:bubble 2.2s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes bubble{50%{transform:scale(1.03);opacity:.8}}
.ent.pulled img{animation:pulled .36s ease-in-out}
@keyframes pulled{50%{transform:translateX(-34px) rotate(-6deg)}}
.ent.roll img{animation:roll .52s ease-in-out}
@keyframes roll{50%{transform:translateX(-140px) rotate(-360deg)}100%{transform:none}}
.ent.puff img{animation:puffup .6s ease-in-out}
@keyframes puffup{40%{transform:scale(1.3)}100%{transform:none}}
.flycard{box-shadow:0 0 0 3px #fff,0 0 30px #ffe680 !important}
.ver{position:absolute;right:max(10px,var(--sar,0px));bottom:6px;font-size:12px;font-weight:800;color:#fff;opacity:.6;letter-spacing:.5px}
@media (prefers-reduced-motion: reduce){.act-dash .lilywrap,.act-flip .lilywrap,.act-flip2 .lilywrap,.act-leap .lilywrap,.act-backflip .lilywrap,.act-roll .lilywrap,.act-pose .lilywrap{animation-duration:.01s}}

/* ---------- monster tiers ---------- */
.ent.tier1 img{filter:drop-shadow(0 0 6px var(--glow)) drop-shadow(0 6px 4px #0006)}
.ent.tier2 img{filter:drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 3px var(--glow)) drop-shadow(0 6px 4px #0006)}
.tstar{color:#ffe14d;text-shadow:0 0 4px #000}
.bookp{max-width:720px}
.book{display:flex;flex-direction:column;gap:8px}
.bookrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bookcell{background:#fff;border:2px solid #e9cf95;border-radius:12px;padding:6px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.bookcell img{height:62px;width:100%;object-fit:contain;filter:drop-shadow(0 0 5px var(--glow,transparent))}
.bookcell b{font-size:13px;line-height:1.15;margin-top:3px}
.bookcell small{font-size:11px;color:#7a5a2a;font-weight:800}
.bookcell.unseen img{filter:brightness(0) opacity(.35)}
.bookcell.unseen b{color:#999}

.vchips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.tog .vchips button{min-width:0;padding:6px 9px;font-size:14px}
</style></head>

// ================= AUDIO: pirate band + sound effects =================
// Everything is synthesised with Web Audio (no audio files): accordion, fiddle,
// tin whistle, plucked bass, bodhrán drum, shaker, ship's bell. Original tunes.
let AC = null, master = null, musicGain = null, sfxGain = null, reverb = null, NOISE = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      master = AC.createGain(); master.gain.value = 0.9; master.connect(comp); comp.connect(AC.destination);
      sfxGain = AC.createGain(); sfxGain.gain.value = SFX_VOL[(META && META.set && META.set.sfxVol) || 'med']; sfxGain.connect(master);
      musicGain = AC.createGain(); musicGain.gain.value = 0.0001; musicGain.connect(master);
      // small "ship's cabin" reverb
      reverb = AC.createConvolver(); const len = Math.floor(AC.sampleRate * 1.3); const ir = AC.createBuffer(2, len, AC.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * 0.6; }
      reverb.buffer = ir; const rv = AC.createGain(); rv.gain.value = 0.22; reverb.connect(rv); rv.connect(master);
      NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate); const nd = NOISE.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const NOTE_IX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function nm(s) { const m = /^([A-G])(#|b)?(\d)$/.exec(s); return m ? 12 * (+m[3] + 1) + NOTE_IX[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) : null; }
function out(node, dest, wet) { node.connect(dest); if (wet && reverb) { const s = AC.createGain(); s.gain.value = wet; node.connect(s); s.connect(reverb); } }
function env(g, t, a, peak, hold, rel) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel); return t + a + hold + rel; }
function noiseSrc(t, dur) { const s = AC.createBufferSource(); s.buffer = NOISE; s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05); return s; }

// ---------- instruments ----------
const INST = {
  // squeezebox: two detuned saws per reed + tremolo, warm low-pass
  accordion(t, midis, dur, v, dest) {
    const g = AC.createGain(); const end = env(g, t, 0.025, v, Math.max(0, dur - 0.06), 0.07);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1700; lp.Q.value = 0.8;
    const trem = AC.createGain(); trem.gain.value = 0.82; const lfo = AC.createOscillator(); lfo.frequency.value = 6.2; const ld = AC.createGain(); ld.gain.value = 0.18; lfo.connect(ld); ld.connect(trem.gain); lfo.start(t); lfo.stop(end);
    for (const m of midis) for (const det of [-7, 7]) { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = det; o.connect(lp); o.start(t); o.stop(end); }
    lp.connect(trem); trem.connect(g); out(g, dest, 0.25);
  },
  // fiddle: bowed saw, slow attack, delayed vibrato
  fiddle(t, m, dur, v, dest) {
    const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = hz(m);
    const vib = AC.createOscillator(); vib.frequency.value = 5.6; const vd = AC.createGain(); vd.gain.setValueAtTime(0, t); vd.gain.linearRampToValueAtTime(dur > 0.3 ? 14 : 5, t + Math.min(0.25, dur)); vib.connect(vd); vd.connect(o.detune);
    const bp = AC.createBiquadFilter(); bp.type = 'peaking'; bp.frequency.value = 2400; bp.gain.value = 5; const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3600;
    const g = AC.createGain(); const end = env(g, t, 0.045, v, Math.max(0, dur - 0.08), 0.12);
    o.connect(bp); bp.connect(lp); lp.connect(g); out(g, dest, 0.3); o.start(t); o.stop(end); vib.start(t); vib.stop(end);
  },
  // tin whistle: sine + soft triangle octave + breath, quick vibrato
  whistle(t, m, dur, v, dest) {
    const g = AC.createGain(); const end = env(g, t, 0.02, v, Math.max(0, dur - 0.05), 0.08);
    const vib = AC.createOscillator(); vib.frequency.value = 6.4; const vd = AC.createGain(); vd.gain.setValueAtTime(0, t); vd.gain.linearRampToValueAtTime(dur > 0.3 ? 18 : 6, t + Math.min(0.2, dur)); vib.connect(vd);
    for (const [type, mul, lv] of [['sine', 1, 1], ['triangle', 2, 0.18]]) { const o = AC.createOscillator(); o.type = type; o.frequency.value = hz(m) * mul; vd.connect(o.detune); const og = AC.createGain(); og.gain.value = lv; o.connect(og); og.connect(g); o.start(t); o.stop(end); }
    const n = noiseSrc(t, 0.08); const nf = AC.createBiquadFilter(); nf.type = 'bandpass'; nf.frequency.value = hz(m) * 2; nf.Q.value = 3; const ng = AC.createGain(); env(ng, t, 0.005, v * 0.25, 0.01, 0.06); n.connect(nf); nf.connect(ng); ng.connect(g);
    out(g, dest, 0.3); vib.start(t); vib.stop(end);
  },
  // plucked upright bass

  return out;
}

        const fresh = written.slice().sort((a, b) => (P.seen[a.id] || -1) - (P.seen[b.id] || -1)).slice(0, Math.max(DAILY_N.written * 3, Math.ceil(written.length / 2)));

      const want = s === 'math' ? DAILY_N.math : DAILY_N.written + DAILY_N.gen;
      for (let i = 0; pool.length < want && i < 400; i++) add(genOne(s));

function fxText(fx, extraDmg = 0, extraBlk = 0) {
  const p = [];
  if (fx.dmg != null) p.push(`Deal <b>${fx.dmg + extraDmg}</b> damage${fx.hits > 1 ? ` <b>${fx.hits}</b> times` : ''}${fx.all ? ' to ALL' : ''}.`);
  if (fx.block) p.push(`Gain <b>${fx.block + extraBlk}</b> Block.`);
  if (fx.heal) p.push(`Heal <b>${fx.heal}</b> HP.`);
  if (fx.weak) p.push(`Weak <b>${fx.weak}</b>${fx.all && fx.dmg == null ? ' to ALL' : ''}.`);
  if (fx.vuln) p.push(`Vulnerable <b>${fx.vuln}</b>${fx.all && fx.dmg == null ? ' to ALL' : ''}.`);
  if (fx.stun) p.push(`<b>Dizzy</b>: monster skips its move.`);
  if (fx.thorns) p.push(`Spikes <b>${fx.thorns}</b>.`);
  if (fx.str) p.push(`Gain <b>${fx.str}</b> Strength.`);
  if (fx.energy) p.push(`Gain <b>${fx.energy}</b> ⚡.`);
  if (fx.draw) p.push(`Draw <b>${fx.draw}</b>.`);
  if (fx.double) p.push(`Your next attack deals <b>double</b>.`);
  if (fx.blockTurn) p.push(`Every turn: gain <b>${fx.blockTurn}</b> Block.`);
  if (fx.study) p.push(`Add <b>${fx.study}</b> random Study cards to your hand. They cost 0.`);
  if (fx.exhaust) p.push(`<i>Used up.</i>`);
  return p.join(' ');
}

// ---------------- map ----------------
function genMap(sea) {
  const nodes = {}, edges = new Set();
  const key = (r, l) => r + '-' + l;
  const starts = shuffle([0, 1, 2, 3]).slice(0, 3);
  starts.push(pick([0, 1, 2, 3]));
  for (const s of starts) {
    let l = s;
    for (let r = 0; r < 5; r++) {
      nodes[key(r, l)] = nodes[key(r, l)] || { id: key(r, l), r, l };
      if (r < 4) { const nl = clamp(l + pick([-1, 0, 0, 1]), 0, 3); edges.add(key(r, l) + '>' + key(r + 1, nl)); l = nl; }
      else edges.add(key(r, l) + '>B');
    }
  }
  nodes.B = { id: 'B', r: 5, l: 1.5, t: 'boss' };
  const W = { 0: [['fight', 1]], 1: [['fight', 65], ['event', 35]], 2: [['fight', 35], ['event', 25], ['shop', 20], ['treasure', 20]], 3: [['fight', 30], ['elite', 45], ['event', 25]], 4: [['rest', 65], ['shop', 35]] };
  const wpick = ws => { let t = ws.reduce((a, b) => a + b[1], 0), x = Math.random() * t; for (const w of ws) { if ((x -= w[1]) < 0) return w[0]; } return ws[0][0]; };
  for (const n of Object.values(nodes)) if (!n.t) n.t = wpick(W[n.r]);
  // guarantees
  const row = r => Object.values(nodes).filter(n => n.r === r);
  if (!row(4).some(n => n.t === 'rest')) pick(row(4)).t = 'rest';
  if (row(3).length > 1 && !row(3).some(n => n.t === 'elite')) pick(row(3)).t = 'elite';
  for (const n of Object.values(nodes)) n.j = [(Math.random() - .5) * 18, (Math.random() - .5) * 14];
  return { sea, nodes: Object.values(nodes), edges: [...edges].map(e => e.split('>')) };
}

async function playCard(ci, target) {
  if (C.busy) return;
  const d = cardDef(ci); const cost = cardCost(ci);

  }
  await resolveFx(fx, target, study, d);
  if (!C) return;
  if (d.type === 'power') { /* stays in play */ }
  else if (fx.exhaust || d.fx.exhaust) C.exh.push(ci);
  else C.disc.push(ci);

}
async function resolveFx(fx, target, study, d) {
  const P = C.p; const pl = $('#pl');
  const wasDouble = P.double;
  const powered = !!(d && d.pow && fx === d.pow);
  if (fx.dmg != null) {
    let base = fx.dmg + (fx.star ? 10 * C.stars : 0);
    const hits = fx.hits || 1;
    for (let h = 0; h < hits; h++) {
      const targets = fx.all ? alive() : [target && target.hp > 0 ? target : alive()[0]].filter(Boolean);
      if (!targets.length) break;
      if (SPD < 1) { pl.classList.add('lunge-r'); await sleep(150); pl.classList.remove('lunge-r'); sfx('slash'); }
      await FX.attack(d, { targets, h, powered });
      if (!C) return;
      for (const e of targets) { if (e.hp <= 0) continue; if (SPD < 1) slashAt(entEl(e)); const dealt = damageEnemy(e, attackDmg(base, e, study)); FX.afterHit(e, dealt); if (e.thorns && dealt >= 0) hurtPlayerThorns(e.thorns); }
      renderEnts();
      if (RUN.hp <= 0) return lose();
      await sleep(hits > 1 ? 140 : 90);
    }
    if (wasDouble) P.double = 0;
  }
  let skillFx = false;
  if (fx.block) { gainBlock(fx.block + (study ? P.studyBonus : 0)); FX.block(d && d.id); skillFx = true; }
  if (fx.heal) { const h = Math.min(fx.heal, RUN.maxHp - RUN.hp); RUN.hp += h; float(pl, h > 0 ? '+' + h + ' ❤️' : 'Full HP ❤️', 'heal'); FX.heal(); skillFx = true; }
  const tg = fx.all ? alive() : [target && target.hp > 0 ? target : alive()[0]].filter(Boolean);
  if (fx.weak) tg.forEach(e => { e.weak += fx.weak; float(entEl(e), '😵 Weak', 'txt'); FX.debuff(e, 'weak'); });
  if (fx.vuln) tg.forEach(e => { e.vuln += fx.vuln; float(entEl(e), '💔 Vulnerable', 'txt'); FX.debuff(e, 'vuln'); });
  if (fx.stun) tg.forEach(e => { e.stun = 1; float(entEl(e), '💫 Dizzy!', 'txt'); FX.debuff(e, 'stun'); });
  if (fx.thorns) { P.thorns += fx.thorns; FX.thorns(); }
  if (fx.str) { P.str += fx.str; sfx('buff'); float(pl, '💪 +' + fx.str, 'txt'); if (d && d.type === 'power') FX.power(d.art); else FX.buff('💪'); skillFx = true; }
  if (fx.energy) { C.energy += fx.energy; float(pl, '⚡ +' + fx.energy, 'txt'); FX.energy(); }
  if (fx.draw) { drawCards(fx.draw); FX.draw(fx.draw); }
  if (fx.double) { P.double = 1; FX.double(); skillFx = true; }
  if (fx.blockTurn) { P.blockTurn += fx.blockTurn; FX.power(d && d.art); skillFx = true; }
  if (fx.studyBonus) { P.studyBonus += fx.studyBonus; FX.power(d && d.art); skillFx = true; }
  if (fx.study) FX.study();
  if (fx.study) for (let i = 0; i < fx.study; i++) if (C.hand.length < 10) C.hand.push({ uid: UID++, id: pick(STUDY_IDS), up: 0, free: 'combat' });
  renderAll();
  await sleep(skillFx ? 330 : 150);
}

// ---------------- quiz overlay ----------------
function askQuestion(subj, opts = {}) {
  return new Promise(resolve => {
    const q = pickQuestion(subj); const S = SUBJECTS[q.s];
    window.__q = q; duckMusic(true);
    const answers = shuffle([q.a, ...q.w.slice(0, 3)]);
    let dim = null; if (hasRelic('hint')) dim = pick(q.w.slice(0, 3));
    const cd = opts.card ? cardDef(opts.card) : null;
    const head = cd ? `<div class="pw">${cd.art} <b>${esc(cd.name)}</b> — answer right to <b>POWER UP!</b></div>` : opts.title ? `<div class="pw"><b>${opts.title}</b>${opts.line ? '<br><span style="font-weight:600">' + opts.line + '</span>' : ''}</div>` : '';
    const p = overlay(`${head}<div class="qtag" style="background:${S.color}">${S.icon} ${S.name}${q.review ? ' · SECOND CHANCE 🔁' : ''}</div>
      <div class="qq">${esc(q.q)}${META.set.speak && window.speechSynthesis ? '<button class="say" id="bSay">🔊</button>' : ''}</div>
      <div class="ans">${answers.map((a, i) => `<button data-i="${i}" class="${a === dim ? 'dim' : ''}">${esc(a)}</button>`).join('')}</div><div id="qres"></div>`, 'quiz');
    const sb = $('#bSay'); if (sb) sb.onclick = () => say(q.q + '. ' + answers.join('. '), S.lang);
    let done = false;
    p.querySelectorAll('.ans button').forEach(b => b.onclick = () => {
      if (done) return; const a = answers[+b.dataset.i]; if (a === dim) return;
      done = true; const ok = a === q.a;
      p.querySelectorAll('.ans button').forEach(x => { if (answers[+x.dataset.i] === q.a) x.classList.add('ok'); });
      if (!ok) b.classList.add('no');
      recordAnswer(q, ok);
      if (RUN) { RUN.stats[ok ? 'right' : 'wrong']++; }
      if (C) onAnswerInFight(ok, q);
      sfx(ok ? 'ok' : 'no');
      const res = $('#qres');
      const finish = () => { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (e) { } duckMusic(false); closeOverlay(); resolve(ok); };
      if (ok) {
        res.innerHTML = `<div class="bigok">✅ ${pick(['Great!', 'Awesome!', 'You got it!', 'Super smart!', 'Perfect!'])}</div>${q.ex ? `<div class="ex">${esc(q.ex)}</div>` : ''}<div style="text-align:center;margin-top:10px"><button class="btn green" id="qgo">${cd ? 'POWER UP! ⚡' : 'Continue'}</button></div>`;
        $('#qgo').onclick = finish;
      } else {
        res.innerHTML = `<div class="ex">❌ The answer is <b>${esc(q.a)}</b>.<br>${esc(q.ex || '')}<br><small>This question will come back later.</small></div><div style="text-align:center;margin-top:10px"><button class="btn blue" id="qgo">Got it</button></div>`;
        $('#qgo').onclick = finish;
      }
    });
  });
}
function onAnswerInFight(ok, q) {

function rollRarity(kind) { const x = Math.random(); if (kind === 'elite') return x < 0.12 ? 'rare' : x < 0.5 ? 'uncommon' : 'common'; if (kind === 'shop') return x < 0.15 ? 'rare' : x < 0.5 ? 'uncommon' : 'common'; return x < 0.06 ? 'rare' : x < 0.36 ? 'uncommon' : 'common'; }
function cardChoices(kind, n = 3, studyOnly = false) {
  const out = []; let guard = 0;

    const pool = POOL[rollRarity(kind)].filter(id => !studyOnly || CARDS[id].subj);

}

  $('#bNap').onclick = () => { RUN.hp = Math.min(RUN.maxHp, RUN.hp + heal); sfx('ok'); finishNode(n); topBar(true); toast(`💤 +${heal} HP`); showMap(); };
  $('#bStudy').onclick = () => showDeck({ title: 'Upgrade which card?', filter: c => !c.up && CARDS[c.id].up, preview: true, onPick: i => { RUN.deck[i].up = 1; sfx('star'); closeOverlay(); finishNode(n); toast('✨ Card upgraded!'); showMap(); } });
}

// ---------------- treasure ----------------
function showTreasure(n) {
  if (n.loot === undefined) { n.loot = randRelic(Math.random() < 0.3 ? ['rare'] : ['common']) || randRelic(['common', 'rare']); saveRun(); }
  const r = n.loot;
  setScreen(`${seaBg(RUN.sea)}<div class="title-wrap"><div class="panel center"><h2>💎 Treasure chest!</h2>
   <div style="font-size:80px">🧰</div>
   ${r ? `<div class="relicbig"><span class="em">${RELICS[r].art}</span><span><b>${RELICS[r].name}</b>${RELICS[r].d}</span></div>` : '<p style="font-weight:800">🪙 50 gold!</p>'}
   <button class="btn green" id="bTake">Take it!</button></div></div>`);
  $('#bTake').onclick = () => { if (r) gainRelic(r); else { RUN.gold += 50; sfx('coin'); } finishNode(n); showMap(); };
}

// ---------------- events ----------------
function showEvent(n) {
  if (!n.ev) { n.ev = pick(EVENTS); saveRun(); }
  const box = (title, art, text, buttons) => setScreen(`${seaBg(RUN.sea)}<div class="title-wrap"><div class="panel center"><h2>${title}</h2><div style="font-size:72px;line-height:1">${art}</div><p style="text-align:center;font-weight:700;font-size:17px">${text}</p><div class="choice" style="width:100%">${buttons}</div></div></div>`);
  const done = (msg) => { finishNode(n); topBar(true); if (msg) toast(msg, 2000); showMap(); };
  const subjs = () => shuffle(Object.keys(SUBJECTS));
  if (n.ev === 'quiz') {
    box('🐢 Quiz Island', '🐢', 'A wise old turtle guards a chest. "Answer my 3 questions, little pirate! 15 gold for each right answer — and a treasure if you get all 3!"', '<button class="btn green" id="e1">Accept the challenge!</button><button class="btn ghost" style="color:#666;border-color:#bbb" id="e2">Sail away</button>');
    $('#e1').onclick = async () => { let r = 0; for (const s of subjs().slice(0, 3)) { if (await askQuestion(s, { title: `Turtle question ${r + 1}…` })) r++; }
      let g = r * 15; if (hasRelic('map')) g = Math.round(g * 1.5); RUN.gold += g; let msg = `${r}/3 right · 🪙 +${g}`;
      if (r === 3) { const rl = randRelic(['common']); if (rl) { gainRelic(rl); msg += `<br>${RELICS[rl].art} ${RELICS[rl].name}!`; } }
      done(msg); };
    $('#e2').onclick = () => done();
  } else if (n.ev === 'bottle') {
    box('🍾 Message in a Bottle', '🍾', 'A bottle bobs in the waves. Inside is a riddle! Solve it to unlock a secret Study card.', '<button class="btn green" id="e1">Open the bottle</button>');
    $('#e1').onclick = async () => { const ok = await askQuestion(pick(Object.keys(SUBJECTS)), { title: 'The bottle riddle' });
      if (!ok) { RUN.gold += 10; return done('The bottle had 10 gold inside 🪙'); }
      const ch = cardChoices('elite', 3, true); finishNode(n);
      overlay(`<h2>Choose a Study card</h2><div class="cardrow">${ch.map(id => cardHTML({ id, up: 0 }, { cls: 'static pick', attr: `data-pick="${id}"` })).join('')}</div>`);
      document.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => { RUN.deck.push({ id: el.dataset.pick, up: 0 }); sfx('coin'); saveRun(); closeOverlay(); topBar(true); showMap(); }); };
  } else if (n.ev === 'dolphins') {
    box('🐬 Friendly Dolphins', '🐬', 'A pod of dolphins splashes around the ship! They want to play.', `<button class="btn green" id="e1"><span class="em">💚</span><span><b>Swim with them</b><br><small>Heal 15 HP</small></span></button><button class="btn blue" id="e2"><span class="em">🔬</span><span><b>Learn about dolphins</b><br><small>Answer a Science question: right = +6 Max HP</small></span></button>`);
    $('#e1').onclick = () => { RUN.hp = Math.min(RUN.maxHp, RUN.hp + 15); sfx('ok'); done('💚 +15 HP'); };
    $('#e2').onclick = async () => { if (await askQuestion('science', { title: 'Dolphin science!' })) { RUN.maxHp += 6; RUN.hp += 6; done('❤️ Max HP +6!'); } else done('The dolphins wave goodbye 👋'); };
  } else if (n.ev === 'gym') {
    box('🤸 Beach Gymnastics Show', '🤸', 'The island kids are having a gymnastics show! Do a routine — answer 2 questions. Each right answer is a perfect landing: +4 Max HP.', '<button class="btn green" id="e1">Show them my routine!</button>');
    $('#e1').onclick = async () => { let r = 0; for (const s of subjs().slice(0, 2)) if (await askQuestion(s, { title: 'Perfect landing?' })) r++; RUN.maxHp += r * 4; RUN.hp += r * 4; done(r ? `🏅 ${r} perfect landing${r > 1 ? 's' : ''}! Max HP +${r * 4}` : 'Nice try! The crowd still cheers 👏'); };
  } else if (n.ev === 'art') {
    box('🎨 Drawing Contest', '🎨', 'A painter on the beach is holding a drawing contest. Lily draws a beautiful sea monster! Choose your prize:', `<button class="btn blue" id="e1"><span class="em">✨</span><span><b>Golden pencil</b><br><small>Upgrade a random card</small></span></button><button class="btn red" id="e2"><span class="em">🧽</span><span><b>Magic eraser</b><br><small>Remove a card from your deck</small></span></button>`);
    $('#e1').onclick = () => { const opts = RUN.deck.map((c, i) => [c, i]).filter(([c]) => !c.up && CARDS[c.id].up); if (opts.length) { const [c] = pick(opts); c.up = 1; done(`✨ ${cardDef(c).name} upgraded!`); } else done(); };
    $('#e2').onclick = () => showDeck({ title: 'Erase which card?', filter: () => true, onPick: i => { RUN.deck.splice(i, 1); closeOverlay(); done('🧽 Card erased'); } });
  }
}

// ---------------- deck viewer ----------------
function showDeck(opts = null) {
  const list = RUN.deck.map((c, i) => [c, i]).filter(([c]) => !opts || opts.filter(c));
  const order = { attack: 0, skill: 1, power: 2 };
  list.sort((a, b) => (order[CARDS[a[0].id].type] - order[CARDS[b[0].id].type]) || (a[0].id < b[0].id ? -1 : 1));
  const p = overlay(`<h2>${opts ? opts.title : `🃏 Your deck (${RUN.deck.length})`}</h2>${opts && opts.preview ? '<p style="text-align:center;margin:0 0 8px" class="muted">The card will show its upgraded version.</p>' : ''}
   <div class="deckgrid">${list.map(([c, i]) => cardHTML(opts && opts.preview ? { id: c.id, up: 1 } : c, { cls: 'static', attr: `data-di="${i}"` })).join('')}</div>
   <div style="text-align:center;margin-top:12px"><button class="btn" id="bx">${opts ? 'Cancel' : 'Close'}</button></div>`);
  if (opts) p.querySelectorAll('[data-di]').forEach(el => el.onclick = () => opts.onPick(+el.dataset.di));
  $('#bx').onclick = closeOverlay;
}
function pileView(title, cards) {
  overlay(`<h2>${title} (${cards.length})</h2><div class="deckgrid">${cards.map(c => cardHTML({ id: c.id, up: c.up }, { cls: 'static' })).join('') || '<p>Empty</p>'}</div><div style="text-align:center;margin-top:12px"><button class="btn" id="bx">Close</button></div>`);
  $('#bx').onclick = closeOverlay;
}

// ---------------- boot ----------------
// ---- screen fitting: Fold cover / inner, every rotation ----
const IN_APP = /LilyCardsApp/.test(navigator.userAgent);
let lastWH = '', curScreen = null;
function fitScreen(force) {
  const w = window.innerWidth, h = window.innerHeight, key = w + 'x' + h;
  if (key === lastWH && !force) return; lastWH = key;
  const root = document.documentElement, land = w > h * 1.12;
  document.body.classList.toggle('land', land);
  document.body.classList.toggle('short', h < 560);
  document.body.classList.toggle('big', Math.min(w, h) >= 700);
  // safe areas: read env(); inside the app the WebView may report none, so keep clear strips
  const pr = $('#saprobe'); const cs = getComputedStyle(pr);
  let t = parseFloat(cs.paddingTop) || 0, r = parseFloat(cs.paddingRight) || 0, b = parseFloat(cs.paddingBottom) || 0, l = parseFloat(cs.paddingLeft) || 0;
  if (IN_APP && !(t || r || b || l)) { if (land) { l = r = 34; b = 12; } else { t = 34; b = 18; } }
  root.style.setProperty('--sat', t + 'px'); root.style.setProperty('--sar', r + 'px'); root.style.setProperty('--sab', b + 'px'); root.style.setProperty('--sal', l + 'px');
  if (C) { layoutField(); renderHand(); }
  else if (curScreen === 'map' && RUN) showMap(true);
}
window.addEventListener('resize', () => fitScreen());
window.addEventListener('orientationchange', () => setTimeout(() => fitScreen(true), 120));
setInterval(() => fitScreen(), 400);
document.addEventListener('pointerdown', () => audio());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!document.hidden && AC && AC.state !== 'running') AC.resume().catch(() => {}); });
// ---- offline (iPad home-screen app) ----
const CAN_SW = !window.NO_SW && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !!document.querySelector('link[rel=manifest]');
let OFFLINE_OK = null; // null = not applicable, false = not saved yet, true = saved
async function checkOffline() {
  if (!CAN_SW) return;
  try {
    const ks = await caches.keys(); let ok = false;
    for (const k of ks) if (k.startsWith('lily-cards') && await (await caches.open(k)).match('./index.html', { ignoreSearch: true })) ok = true;
    OFFLINE_OK = ok && !!navigator.serviceWorker.controller;
  } catch (e) { OFFLINE_OK = false; }
  const el = document.getElementById('offl'); if (el) el.outerHTML = offlineBadge();
}
function offlineBadge() {
  if (OFFLINE_OK === null) return '<div id="offl"></div>';
  return OFFLINE_OK
    ? '<div id="offl" class="offl ok">✓ Saved on this iPad · plays without internet</div>'
    : '<div id="offl" class="offl wait">⏳ Saving for offline… keep internet on a moment</div>';
}
if (CAN_SW) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(() => setTimeout(checkOffline, 300)).catch(() => { OFFLINE_OK = null; const el = document.getElementById('offl'); if (el) el.outerHTML = offlineBadge(); });
  navigator.serviceWorker.addEventListener('controllerchange', () => setTimeout(checkOffline, 300));
  setTimeout(checkOffline, 1500); setInterval(() => { if (OFFLINE_OK === false) checkOffline(); }, 3000);
  // ask the browser to keep our storage (home-screen apps on iPad are kept anyway)
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) { }
}
window.render_game_to_text = () => JSON.stringify(C ? { screen: 'fight', hp: RUN.hp, energy: C.energy, block: C.p.block, hand: C.hand.map(c => c.id), enemies: C.enemies.map(e => ({ id: e.id, hp: e.hp, block: e.block, intent: e.intent })), busy: C.busy, stars: C.stars } : { screen: RUN ? 'run' : 'title', hp: RUN && RUN.hp, gold: RUN && RUN.gold, sea: RUN && RUN.sea });
window.G = { get C() { return C; }, get RUN() { return RUN; }, tapCard, playCard, endTurn, showMap, enterNode, availNodes, CARDS };
preloadArt();
document.body.insertAdjacentHTML('beforeend', '<div id="saprobe"></div>');
fitScreen(true); loadMeta(); loadSheet(); showTitle();
</script></body></html>
